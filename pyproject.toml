[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "atlas-lyme-mcp"
version = "0.1.0"
description = "Agent-facing MCP interface for the One Health Lyme Gap Atlas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "httpx2>=2.13,<3",
    "jsonschema>=4.26,<5",
    "mcp>=2.2,<3",
    "one-health-lyme-gap-atlas-shared[observability] @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-shared-python.git@1663267c6a3121d7cbb1d40b95a6dc50ee5e1642",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["mypy>=1.17,<2", "pytest>=8,<10", "ruff>=0.12,<1", "types-jsonschema>=4,<5"]

[project.scripts]
atlas-lyme-mcp = "atlas_lyme_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_lyme_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
