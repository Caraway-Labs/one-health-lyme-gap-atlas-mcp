[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-lyme-mcp"
version = "0.1.0"
description = "Agent-facing MCP interface for the One Health Lyme Gap Atlas"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.2,<3", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
atlas-lyme-mcp = "atlas_lyme_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_lyme_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
