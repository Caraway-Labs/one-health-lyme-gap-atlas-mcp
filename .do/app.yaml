name: oh-lyme-mcp-dev
region: sfo
domains:
  - domain: mcp.onehealthatlas.org
    type: ALIAS
alerts:
  - rule: DEPLOYMENT_FAILED
services:
  - name: mcp
    github:
      repo: Caraway-Labs/one-health-lyme-gap-atlas-mcp
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: HOST
        value: 0.0.0.0
        scope: RUN_TIME
      - key: PORT
        value: "8000"
        scope: RUN_TIME
      - key: MCP_ALLOWED_HOSTS
        value: "oh-lyme-mcp-dev-7jcfi.ondigitalocean.app,oh-lyme-mcp-dev-7jcfi.ondigitalocean.app:443,mcp.onehealthatlas.org,mcp.onehealthatlas.org:443"
        scope: RUN_TIME
